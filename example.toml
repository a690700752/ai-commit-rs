# Example configuration for ai-commit-rs
# Place this file at ~/.ai-commit-rs.toml

# (Optional) OpenAI API base URL.
# Priority: openai_base_url > env.OPENAI_BASE_URL > default (https://api.openai.com/v1)
# openai_base_url = "https://api.openai.com/v1"

# (Optional) OpenAI API key.
# Priority: openai_api_key > env.OPENAI_API_KEY
# openai_api_key = "sk-..."

# (Optional) The model to use for generating commit messages.
# Defaults to "deepseek-v3-1".
model = "deepseek-v3-1"

# (Optional) The language for the commit message.
# e.g., "Chinese", "Spanish"
# language = "English"

# (Optional) A list of glob patterns for files to ignore when generating the diff.
# The files will still be included in the commit. Below config is default.
# ignore = [
#     "*.lock",
#     "*.log",
#     "target/",
#     "dist/",
#     "build/"
# ]
