[package]
name = "ai-commit-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-openai = { version = "0.32.2", features = ["chat-completion"] }
glob = "0.3.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.13"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
clap = { version = "4.0", features = ["derive"] }
